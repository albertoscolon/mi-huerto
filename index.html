<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1B4332">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi Huerto">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Mi Huerto</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #F4F7F4; color: #1a1a1a; min-height: 100vh; padding-bottom: 40px; }
  header { background: #1B4332; color: white; padding: 16px 20px 14px; position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 20px; font-weight: 600; }
  header span { font-size: 13px; opacity: 0.7; }
  .btn-refresh { background: rgba(255,255,255,0.15); border: none; color: white; padding: 7px 13px; border-radius: 20px; font-size: 13px; cursor: pointer; font-family: inherit; }
  .container { max-width: 600px; margin: 0 auto; padding: 16px; }
  .clima-card { background: #1B4332; color: white; border-radius: 16px; padding: 18px 20px; margin-bottom: 12px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .clima-item { text-align: center; }
  .clima-val { font-size: 22px; font-weight: 600; }
  .clima-lbl { font-size: 11px; opacity: 0.7; margin-top: 2px; }
  .clima-footer { grid-column: 1 / -1; border-top: 1px solid rgba(255,255,255,0.15); padding-top: 10px; font-size: 12px; opacity: 0.6; text-align: center; }
  /* Pronóstico */
  .prono-card { background: white; border: 1px solid #E8EDE8; border-radius: 16px; padding: 12px 10px 10px; margin-bottom: 12px; }
  .prono-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: #999; text-align: center; margin-bottom: 8px; }
  .prono-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
  .prono-day { text-align: center; padding: 6px 2px; border-radius: 10px; }
  .prono-day.lluvia { background: #E8F1FB; }
  .prono-dow { font-size: 11px; font-weight: 600; color: #666; text-transform: capitalize; }
  .prono-ico { font-size: 20px; margin: 3px 0; }
  .prono-tmp { font-size: 11px; color: #333; font-weight: 500; }
  .prono-mm  { font-size: 10px; color: #1565C0; font-weight: 600; margin-top: 1px; min-height: 12px; }
  .prono-aviso { margin-top: 8px; font-size: 12px; border-radius: 10px; padding: 8px 12px; line-height: 1.5; }
  .aviso-lluvia { background: #E8F1FB; color: #1565C0; }
  .aviso-calor  { background: #FFF3E0; color: #E65100; }
  .section-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #666; margin-bottom: 10px; }
  .plant-card { background: white; border-radius: 14px; padding: 16px; margin-bottom: 10px; cursor: pointer; border: 1px solid #E8EDE8; transition: transform 0.1s; }
  .plant-card:active { transform: scale(0.98); }
  .plant-card.urgente { border-left: 4px solid #E53935; }
  .plant-card.pronto  { border-left: 4px solid #F9A825; }
  .plant-card.ok      { border-left: 4px solid #43A047; }
  .plant-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .plant-name { font-size: 16px; font-weight: 600; }
  .plant-tipo { font-size: 12px; color: #888; margin-top: 1px; }
  .badge { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px; }
  .badge-urgente { background: #FFEBEE; color: #C62828; }
  .badge-pronto  { background: #FFF8E1; color: #F57F17; }
  .badge-ok      { background: #E8F5E9; color: #2E7D32; }
  .badge-neutral { background: #F5F5F5; color: #666; }
  .plant-rows { display: flex; flex-direction: column; gap: 6px; }
  .plant-row { display: flex; justify-content: space-between; font-size: 13px; }
  .plant-row-lbl { color: #888; }
  .plant-row-val { font-weight: 500; color: #333; text-align: right; max-width: 65%; }
  .quick-btns { display: flex; gap: 8px; margin-top: 12px; }
  .quick-btn { flex: 1; text-align: center; padding: 8px 4px; border-radius: 10px; font-size: 12px; font-weight: 600; text-decoration: none; border: none; cursor: pointer; font-family: inherit; }
  .quick-btn:disabled { opacity: 0.6; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1B4332; color: white; padding: 12px 20px; border-radius: 24px; font-size: 14px; font-weight: 600; z-index: 300; box-shadow: 0 4px 16px rgba(0,0,0,0.25); max-width: 90%; text-align: center; }
  .toast.err { background: #C62828; }
  .quick-riego { background: #E3F2FD; color: #1565C0; }
  .quick-fert  { background: #F3E5F5; color: #6A1B9A; }
  .cache-nota { background: #FFF8E1; border-radius: 10px; padding: 10px 14px; font-size: 12px; color: #856404; margin-bottom: 12px; text-align: center; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; display: none; align-items: flex-end; }
  .overlay.open { display: flex; }
  .detail-sheet { background: white; width: 100%; max-height: 90vh; border-radius: 20px 20px 0 0; padding: 20px; overflow-y: auto; animation: slideUp 0.25s ease; }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .detail-handle { width: 40px; height: 4px; background: #DDD; border-radius: 2px; margin: 0 auto 20px; }
  .detail-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 20px; }
  .detail-name { font-size: 22px; font-weight: 700; }
  .detail-sub { font-size: 13px; color: #888; margin-top: 3px; }
  .btn-close { background: #F5F5F5; border: none; border-radius: 50%; width: 32px; height: 32px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .detail-section { margin-bottom: 20px; }
  .detail-section-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #999; margin-bottom: 10px; }
  .detail-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #F0F0F0; font-size: 14px; }
  .detail-row:last-child { border-bottom: none; }
  .detail-row-lbl { color: #888; }
  .detail-row-val { font-weight: 500; text-align: right; max-width: 65%; line-height: 1.4; }
  .action-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
  .btn-action { padding: 14px 10px; border: none; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; }
  .btn-action:active { opacity: 0.8; transform: scale(0.96); }
  .btn-riego { background: #E3F2FD; color: #1565C0; }
  .btn-fert  { background: #F3E5F5; color: #6A1B9A; }
  .btn-action .btn-icon { font-size: 22px; }
  .btn-action .btn-lbl  { font-size: 12px; }
  .form-nota { background: #FFF8E1; border-radius: 10px; padding: 10px 14px; font-size: 12px; color: #856404; margin-bottom: 16px; line-height: 1.6; }
  .loading { text-align: center; padding: 60px 20px; color: #888; }
  .spinner { width: 36px; height: 36px; border: 3px solid #E0E0E0; border-top-color: #1B4332; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-box { background: #FFF3F3; border: 1px solid #FFCDD2; border-radius: 12px; padding: 20px; text-align: center; color: #C62828; font-size: 14px; line-height: 1.6; }
  .last-update { text-align: center; font-size: 12px; color: #AAA; margin-top: 16px; }
</style>
</head>
<body>
<header>
  <div><h1>Mi Huerto</h1><span id="header-date"></span></div>
  <button class="btn-refresh" onclick="forzarActualizacion()">Actualizar</button>
</header>
<div class="container"><div id="content"><div class="loading"><div class="spinner"></div><div>Cargando tu huerto...</div></div></div></div>
<div class="overlay" id="overlay" onclick="cerrarDetalle(event)">
  <div class="detail-sheet"><div class="detail-handle"></div><div id="detail-content"></div></div>
</div>
<script>
const API_URL   = 'https://script.google.com/macros/s/AKfycbw67Fssw4HnC1sEW4Oz69Qq4wXnh5G0-WXa0sWs1jSHFxoWPayCMWPwn1Sz-TPd2peO/exec';

// Ubicación del huerto: Cañadas del Parque, Dílar (Granada)
const LAT = 37.069, LON = -3.593;

let datosGlobales  = null;
let pronosticoHTML = '';
let lastLoad       = 0;

document.getElementById('header-date').textContent = new Date().toLocaleDateString('es-ES', {weekday:'long',day:'numeric',month:'long'});

function getBadgeClass(s) {
  if (!s) return 'badge-neutral';
  s = s.toString().toUpperCase();
  if (s.includes('URGENTE')) return 'badge-urgente';
  if (s.includes('PRONTO'))  return 'badge-pronto';
  if (s.includes('OK'))      return 'badge-ok';
  return 'badge-neutral';
}

function getCardClass(s) {
  if (!s) return '';
  s = s.toString().toUpperCase();
  if (s.includes('URGENTE')) return 'urgente';
  if (s.includes('PRONTO'))  return 'pronto';
  if (s.includes('OK'))      return 'ok';
  return '';
}

function renderClima(c) {
  const hora = c.actualizado ? new Date(c.actualizado).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}) : '—';
  return `<div class="clima-card">
    <div class="clima-item"><div class="clima-val">${c.temperatura}°C</div><div class="clima-lbl">Temperatura</div></div>
    <div class="clima-item"><div class="clima-val">${c.humedad}%</div><div class="clima-lbl">Humedad</div></div>
    <div class="clima-item"><div class="clima-val">${c.lluvia3d}mm</div><div class="clima-lbl">Lluvia 3d</div></div>
    <div class="clima-item"><div class="clima-val" style="font-size:14px;padding-top:4px">${c.descripcion}</div><div class="clima-lbl">Estado</div></div>
    <div class="clima-footer">Actualizado: ${hora}</div>
  </div>`;
}

// ── Pronóstico de los próximos 5 días (Open-Meteo, gratis y sin clave) ──
async function cargarPronostico() {
  try {
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}`
      + `&daily=precipitation_sum,precipitation_probability_max,temperature_2m_max,temperature_2m_min`
      + `&timezone=Europe/Madrid&forecast_days=5`;
    const r = await fetch(u);
    const d = await r.json();
    const dias = d.daily.time.map((t, i) => ({
      fecha: new Date(t + 'T12:00:00'),
      mm:    d.daily.precipitation_sum[i] || 0,
      prob:  d.daily.precipitation_probability_max[i] || 0,
      tmax:  Math.round(d.daily.temperature_2m_max[i]),
      tmin:  Math.round(d.daily.temperature_2m_min[i]),
    }));
    const cols = dias.map((x, i) => {
      const dow = i === 0 ? 'Hoy' : x.fecha.toLocaleDateString('es-ES', { weekday: 'short' });
      const ico = x.mm >= 1 || x.prob >= 60 ? '🌧' : x.prob >= 30 ? '🌤' : '☀️';
      return `<div class="prono-day ${x.mm >= 1 ? 'lluvia' : ''}">
        <div class="prono-dow">${dow}</div>
        <div class="prono-ico">${ico}</div>
        <div class="prono-tmp">${x.tmax}°/${x.tmin}°</div>
        <div class="prono-mm">${x.mm >= 0.5 ? x.mm.toFixed(1) + 'mm' : ''}</div>
      </div>`;
    }).join('');
    // Aviso orientativo según lluvia/calor previstos
    const lluvia3 = dias.slice(0, 3).reduce((s, x) => s + x.mm, 0);
    const maxTemp = Math.max(...dias.slice(0, 3).map(x => x.tmax));
    let aviso = '';
    if (lluvia3 >= 5) {
      aviso = `<div class="prono-aviso aviso-lluvia">🌧 Se esperan ${lluvia3.toFixed(0)} mm en los próximos 3 días — probablemente puedas retrasar algún riego.</div>`;
    } else if (lluvia3 < 1 && maxTemp >= 34) {
      aviso = `<div class="prono-aviso aviso-calor">☀️ Sin lluvia y máximas de ${maxTemp}°C — vigila los riegos, sobre todo macetas y plantones.</div>`;
    }
    pronosticoHTML = `<div class="prono-card">
      <div class="prono-title">Pronóstico · Dílar</div>
      <div class="prono-grid">${cols}</div>
      ${aviso}
    </div>`;
    const el = document.getElementById('pronostico');
    if (el) el.outerHTML = pronosticoHTML.replace('<div class="prono-card">', '<div class="prono-card" id="pronostico">');
  } catch (e) { /* sin pronóstico no pasa nada, la app sigue */ }
}

function renderCultivos(cultivos) {
  if (!cultivos || cultivos.length === 0) return `<div style="text-align:center;padding:40px;color:#888;">No hay cultivos registrados.</div>`;
  return cultivos.map((c, i) => `
  <div class="plant-card ${getCardClass(c.semaforoRiego)}" onclick="verDetalle(${i})">
    <div class="plant-header">
      <div><div class="plant-name">${c.nombre || c.tipo}</div><div class="plant-tipo">${c.tipo} · ${c.metodo}</div></div>
      <span class="badge ${getBadgeClass(c.semaforoRiego)}">${c.semaforoRiego || '?'}</span>
    </div>
    <div class="plant-rows">
      <div class="plant-row"><span class="plant-row-lbl">Riego</span><span class="plant-row-val">${c.recomRiego || '—'}</span></div>
      <div class="plant-row"><span class="plant-row-lbl">Cosecha</span><span class="plant-row-val">${c.diasCosecha || '—'}</span></div>
      <div class="plant-row"><span class="plant-row-lbl">Fertilizar</span><span class="plant-row-val">${c.proximaFert || '—'}</span></div>
    </div>
    <div class="quick-btns">
      <button class="quick-btn quick-riego" onclick="registrar(event, ${i}, 'Riego')">💧 Regado</button>
      <button class="quick-btn quick-fert"  onclick="registrar(event, ${i}, 'Fertilizacion')">🌱 Abonado</button>
    </div>
  </div>`).join('');
}

function verDetalle(i) {
  const c = datosGlobales.cultivos[i];
  document.getElementById('detail-content').innerHTML = `
    <div class="detail-header">
      <div><div class="detail-name">${c.nombre || c.tipo}</div><div class="detail-sub">${c.tipo} · ${c.metodo}</div></div>
      <button class="btn-close" onclick="cerrarDetalle()">✕</button>
    </div>
    <div class="action-btns">
      <button class="btn-action btn-riego" onclick="registrar(event, ${i}, 'Riego')">
        <span class="btn-icon">💧</span><span class="btn-lbl">Registrar riego</span>
      </button>
      <button class="btn-action btn-fert" onclick="registrar(event, ${i}, 'Fertilizacion')">
        <span class="btn-icon">🌱</span><span class="btn-lbl">Registrar fertilización</span>
      </button>
    </div>
    <div class="detail-section">
      <div class="detail-section-title">Estado del cultivo</div>
      <div class="detail-row"><span class="detail-row-lbl">Riego</span><span class="detail-row-val">${c.recomRiego || '—'}</span></div>
      <div class="detail-row"><span class="detail-row-lbl">Semáforo riego</span><span class="detail-row-val"><span class="badge ${getBadgeClass(c.semaforoRiego)}">${c.semaforoRiego || '?'}</span></span></div>
      <div class="detail-row"><span class="detail-row-lbl">Fertilización</span><span class="detail-row-val">${c.proximaFert || '—'}</span></div>
      <div class="detail-row"><span class="detail-row-lbl">Semáforo fert.</span><span class="detail-row-val"><span class="badge ${getBadgeClass(c.semaforoFert)}">${c.semaforoFert || '?'}</span></span></div>
    </div>
    <div class="detail-section">
      <div class="detail-section-title">Cosecha</div>
      <div class="detail-row"><span class="detail-row-lbl">Días restantes</span><span class="detail-row-val">${c.diasCosecha || '—'}</span></div>
      <div class="detail-row"><span class="detail-row-lbl">Fecha estimada</span><span class="detail-row-val">${c.fechaCosecha || '—'}</span></div>
    </div>
    <div class="detail-section">
      <div class="detail-section-title">Información</div>
      <div class="detail-row"><span class="detail-row-lbl">Plantado</span><span class="detail-row-val">${c.fechaPlant || '—'}</span></div>
      <div class="detail-row"><span class="detail-row-lbl">Último riego</span><span class="detail-row-val">${c.ultimoRiego || '—'}</span></div>
      <div class="detail-row"><span class="detail-row-lbl">Temporada</span><span class="detail-row-val">${c.temporada || '—'}</span></div>
      ${c.descripcion ? `<div class="detail-row"><span class="detail-row-lbl">Descripción</span><span class="detail-row-val">${c.descripcion}</span></div>` : ''}
    </div>`;
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function cerrarDetalle(e) {
  if (e && e.target !== document.getElementById('overlay')) return;
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow = '';
}

// ── Registro con UN toque: llama directamente al Apps Script ──
async function registrar(ev, i, tipo) {
  ev.stopPropagation();
  ev.preventDefault();
  const c    = datosGlobales.cultivos[i];
  const btn  = ev.currentTarget;
  const orig = btn.innerHTML;
  btn.innerHTML = '⏳ Guardando…';
  btn.disabled  = true;
  try {
    const r = await fetch(API_URL
      + '?accion=registrar&cultivo=' + encodeURIComponent(c.nombre || c.tipo)
      + '&tipo=' + encodeURIComponent(tipo));
    const datos = await r.json();
    datosGlobales = datos;
    lastLoad = Date.now();
    try { localStorage.setItem('huerto-cache', JSON.stringify(datos)) } catch(e) {}
    document.getElementById('overlay').classList.remove('open');
    document.body.style.overflow = '';
    renderTodo(datos, false);
    toast((tipo === 'Riego' ? '💧 ' : '🌱 ') + (c.nombre || c.tipo) + ' — registrado');
  } catch(e) {
    btn.innerHTML = orig;
    btn.disabled  = false;
    toast('⚠️ Sin conexión — no se pudo registrar. Inténtalo con cobertura.', true);
  }
}

function toast(msg, esError) {
  const t = document.createElement('div');
  t.className = 'toast' + (esError ? ' err' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

async function forzarActualizacion() {
  const btn = document.querySelector('.btn-refresh');
  if (btn) { btn.textContent = '...'; btn.disabled = true; }
  try {
    await fetch(API_URL + '?accion=actualizar');
  } catch(e) {}
  await cargarDatos();
  if (btn) { btn.textContent = 'Actualizar'; btn.disabled = false; }
}

function renderTodo(datos, desdeCache) {
  const urgentes = datos.cultivos.filter(c => (c.semaforoRiego||'').includes('URGENTE') || (c.semaforoFert||'').includes('URGENTE')).length;
  const prontos  = datos.cultivos.filter(c => (c.semaforoRiego||'').includes('PRONTO')  || (c.semaforoFert||'').includes('PRONTO')).length;
  const resumen  = urgentes > 0
    ? `<div style="background:#FFEBEE;border-radius:10px;padding:12px 14px;margin-bottom:16px;font-size:13px;color:#C62828;font-weight:500;">🔴 ${urgentes} cultivo${urgentes>1?'s':''} necesita${urgentes>1?'n':''} atención urgente hoy</div>`
    : prontos > 0
    ? `<div style="background:#FFF8E1;border-radius:10px;padding:12px 14px;margin-bottom:16px;font-size:13px;color:#F57F17;font-weight:500;">🟡 ${prontos} cultivo${prontos>1?'s':''} necesita${prontos>1?'n':''} atención pronto</div>`
    : `<div style="background:#E8F5E9;border-radius:10px;padding:12px 14px;margin-bottom:16px;font-size:13px;color:#2E7D32;font-weight:500;">🟢 Todo en orden — nada urgente hoy</div>`;
  const nota = desdeCache
    ? `<div class="cache-nota">📶 Sin conexión — mostrando los últimos datos guardados</div>` : '';
  document.getElementById('content').innerHTML = `
    ${nota}
    ${renderClima(datos.clima)}
    ${pronosticoHTML ? pronosticoHTML.replace('<div class="prono-card">', '<div class="prono-card" id="pronostico">') : '<div id="pronostico"></div>'}
    ${resumen}
    <div class="section-title">Mis cultivos (${datos.cultivos.length})</div>
    ${renderCultivos(datos.cultivos)}
    <div class="last-update">Última actualización: ${new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}</div>`;
}

async function cargarDatos() {
  lastLoad = Date.now();
  try {
    const r     = await fetch(API_URL);
    const datos = await r.json();
    datosGlobales = datos;
    // Guardar copia local para cuando no haya cobertura en el huerto
    try { localStorage.setItem('huerto-cache', JSON.stringify(datos)) } catch(e) {}
    renderTodo(datos, false);
  } catch(e) {
    // Sin conexión: usar la última copia guardada
    try {
      const cache = JSON.parse(localStorage.getItem('huerto-cache'));
      if (cache) { datosGlobales = cache; renderTodo(cache, true); return }
    } catch(e2) {}
    document.getElementById('content').innerHTML = `<div class="error-box">No se pudieron cargar los datos.<br><br>
      <button onclick="cargarDatos()" style="margin-top:10px;padding:8px 16px;background:#C62828;color:white;border:none;border-radius:8px;font-size:13px;cursor:pointer;">Reintentar</button></div>`;
  }
}

// Recargar al volver a la app (p. ej. después de enviar el formulario),
// con freno de 60s para no recargar en cada toque
function refrescoAlVolver() {
  if (document.visibilityState !== 'visible') return;
  if (Date.now() - lastLoad < 60 * 1000) return;
  cargarDatos();
  cargarPronostico();
}
document.addEventListener('visibilitychange', refrescoAlVolver);

cargarDatos();
cargarPronostico();
setInterval(cargarDatos, 30 * 60 * 1000);
