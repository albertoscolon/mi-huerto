<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1B4332">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi Huerto">
<link rel="manifest" href="manifest.json">
<title>Mi Huerto</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #F4F7F4; color: #1a1a1a; min-height: 100vh; padding-bottom: 40px; }
  header { background: #1B4332; color: white; padding: 16px 20px 14px; position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.3px; }
  header span { font-size: 13px; opacity: 0.7; }
  .btn-refresh { background: rgba(255,255,255,0.15); border: none; color: white; padding: 7px 13px; border-radius: 20px; font-size: 13px; cursor: pointer; font-family: inherit; }
  .btn-refresh:active { opacity: 0.7; }
  .container { max-width: 600px; margin: 0 auto; padding: 16px; }
  .clima-card { background: #1B4332; color: white; border-radius: 16px; padding: 18px 20px; margin-bottom: 20px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .clima-item { text-align: center; }
  .clima-val { font-size: 22px; font-weight: 600; }
  .clima-lbl { font-size: 11px; opacity: 0.7; margin-top: 2px; }
  .clima-footer { grid-column: 1 / -1; border-top: 1px solid rgba(255,255,255,0.15); padding-top: 10px; font-size: 12px; opacity: 0.6; text-align: center; }
  .section-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #666; margin-bottom: 10px; }
  .plant-card { background: white; border-radius: 14px; padding: 16px; margin-bottom: 10px; cursor: pointer; border: 1px solid #E8EDE8; transition: transform 0.1s; -webkit-user-select: none; user-select: none; }
  .plant-card:active { transform: scale(0.98); }
  .plant-card.urgente { border-left: 4px solid #E53935; }
  .plant-card.pronto  { border-left: 4px solid #F9A825; }
  .plant-card.ok      { border-left: 4px solid #43A047; }
  .plant-card.regado  { border-left: 4px solid #43A047; opacity: 0.85; }
  .plant-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .plant-name { font-size: 16px; font-weight: 600; color: #1a1a1a; }
  .plant-tipo { font-size: 12px; color: #888; margin-top: 1px; }
  .badge { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px; letter-spacing: 0.03em; }
  .badge-urgente { background: #FFEBEE; color: #C62828; }
  .badge-pronto  { background: #FFF8E1; color: #F57F17; }
  .badge-ok      { background: #E8F5E9; color: #2E7D32; }
  .badge-neutral { background: #F5F5F5; color: #666; }
  .plant-rows { display: flex; flex-direction: column; gap: 6px; }
  .plant-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
  .plant-row-lbl { color: #888; }
  .plant-row-val { font-weight: 500; color: #333; text-align: right; max-width: 65%; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; display: none; align-items: flex-end; }
  .overlay.open { display: flex; }
  .detail-sheet { background: white; width: 100%; max-height: 90vh; border-radius: 20px 20px 0 0; padding: 20px; overflow-y: auto; animation: slideUp 0.25s ease; }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .detail-handle { width: 40px; height: 4px; background: #DDD; border-radius: 2px; margin: 0 auto 20px; }
  .detail-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 20px; }
  .detail-name { font-size: 22px; font-weight: 700; }
  .detail-sub { font-size: 13px; color: #888; margin-top: 3px; }
  .btn-close { background: #F5F5F5; border: none; border-radius: 50%; width: 32px; height: 32px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .detail-section { margin-bottom: 20px; }
  .detail-section-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #999; margin-bottom: 10px; }
  .detail-row { display: flex; justify-content: space-between; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid #F0F0F0; font-size: 14px; }
  .detail-row:last-child { border-bottom: none; }
  .detail-row-lbl { color: #888; flex-shrink: 0; }
  .detail-row-val { font-weight: 500; text-align: right; max-width: 65%; line-height: 1.4; }
  .action-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
  .btn-action { padding: 14px 10px; border: none; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: opacity 0.15s, transform 0.1s; }
  .btn-action:active { transform: scale(0.96); opacity: 0.8; }
  .btn-riego { background: #E3F2FD; color: #1565C0; }
  .btn-fert  { background: #F3E5F5; color: #6A1B9A; }
  .btn-action .btn-icon { font-size: 22px; }
  .btn-action .btn-lbl  { font-size: 12px; }
  .btn-action:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-action.done { background: #E8F5E9; color: #2E7D32; }
  .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #1B4332; color: white; padding: 12px 24px; border-radius: 24px; font-size: 14px; font-weight: 500; z-index: 999; opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; }
  .loading { text-align: center; padding: 60px 20px; color: #888; }
  .spinner { width: 36px; height: 36px; border: 3px solid #E0E0E0; border-top-color: #1B4332; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-box { background: #FFF3F3; border: 1px solid #FFCDD2; border-radius: 12px; padding: 20px; text-align: center; color: #C62828; font-size: 14px; line-height: 1.6; }
  .last-update { text-align: center; font-size: 12px; color: #AAA; margin-top: 16px; }
  .nota-riego { background: #E8F5E9; border-radius: 8px; padding: 8px 12px; font-size: 12px; color: #2E7D32; margin-bottom: 16px; text-align: center; }
</style>
</head>
<body>
<header>
  <div><h1>Mi Huerto</h1><span id="header-date"></span></div>
  <button class="btn-refresh" onclick="cargarDatos()">Actualizar</button>
</header>
<div class="container"><div id="content"><div class="loading"><div class="spinner"></div><div>Cargando tu huerto...</div></div></div></div>
<div class="overlay" id="overlay" onclick="cerrarDetalle(event)">
  <div class="detail-sheet" id="detail-sheet"><div class="detail-handle"></div><div id="detail-content"></div></div>
</div>
<div class="toast" id="toast"></div>
<script>
const API_URL = 'https://script.google.com/macros/s/AKfycby1JSLzON0SmAVdXYJybdYdBdOo28qx0ohnjITzDDV_R6F7EWBymDpmIqndBMbRrP-o/exec';

let datosGlobales = null;
// Registro local de riegos/fertilizaciones hechos en esta sesion
let accionesLocales = {};

document.getElementById('header-date').textContent = new Date().toLocaleDateString('es-ES', {weekday:'long',day:'numeric',month:'long'});

function getBadgeClass(s) {
  if (!s) return 'badge-neutral';
  s = s.toString().toUpperCase();
  if (s.includes('URGENTE')) return 'badge-urgente';
  if (s.includes('PRONTO'))  return 'badge-pronto';
  if (s.includes('OK'))      return 'badge-ok';
  return 'badge-neutral';
}

function getCardClass(c, i) {
  // Si se ha regado en esta sesion, mostrar como OK
  if (accionesLocales[i] && accionesLocales[i].riego) return 'ok';
  const s = (c.semaforoRiego || '').toString().toUpperCase();
  if (s.includes('URGENTE')) return 'urgente';
  if (s.includes('PRONTO'))  return 'pronto';
  if (s.includes('OK'))      return 'ok';
  return '';
}

function getRecomRiego(c, i) {
  if (accionesLocales[i] && accionesLocales[i].riego) return '✅ Regado hoy';
  return c.recomRiego || '—';
}

function getSemaforoRiego(c, i) {
  if (accionesLocales[i] && accionesLocales[i].riego) return '🟢 OK';
  return c.semaforoRiego || '?';
}

function getProximaFert(c, i) {
  if (accionesLocales[i] && accionesLocales[i].fert) return '✅ Fertilizado hoy';
  return c.proximaFert || '—';
}

function getSemaforoFert(c, i) {
  if (accionesLocales[i] && accionesLocales[i].fert) return '🟢 OK';
  return c.semaforoFert || '?';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function renderClima(c) {
  const hora = c.actualizado ? new Date(c.actualizado).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}) : '—';
  return `<div class="clima-card">
    <div class="clima-item"><div class="clima-val">${c.temperatura}°C</div><div class="clima-lbl">Temperatura</div></div>
    <div class="clima-item"><div class="clima-val">${c.humedad}%</div><div class="clima-lbl">Humedad</div></div>
    <div class="clima-item"><div class="clima-val">${c.lluvia3d}mm</div><div class="clima-lbl">Lluvia 3d</div></div>
    <div class="clima-item"><div class="clima-val" style="font-size:14px;padding-top:4px">${c.descripcion}</div><div class="clima-lbl">Estado</div></div>
    <div class="clima-footer">Actualizado: ${hora}</div>
  </div>`;
}

function renderCultivos(cultivos) {
  if (!cultivos || cultivos.length === 0) {
    return `<div style="text-align:center;padding:40px 20px;color:#888;font-size:14px;">No hay cultivos registrados.<br>Añádelos en tu Google Sheets.</div>`;
  }
  return cultivos.map((c, i) => `
  <div class="plant-card ${getCardClass(c, i)}" onclick="verDetalle(${i})">
    <div class="plant-header">
      <div><div class="plant-name">${c.nombre || c.tipo}</div><div class="plant-tipo">${c.tipo} · ${c.metodo}</div></div>
      <span class="badge ${getBadgeClass(getSemaforoRiego(c,i))}">${getSemaforoRiego(c,i)}</span>
    </div>
    <div class="plant-rows">
      <div class="plant-row"><span class="plant-row-lbl">Riego</span><span class="plant-row-val">${getRecomRiego(c,i)}</span></div>
      <div class="plant-row"><span class="plant-row-lbl">Cosecha</span><span class="plant-row-val">${c.diasCosecha || '—'}</span></div>
      <div class="plant-row"><span class="plant-row-lbl">Fertilizar</span><span class="plant-row-val">${getProximaFert(c,i)}</span></div>
    </div>
  </div>`).join('');
}

function verDetalle(i) {
  const c = datosGlobales.cultivos[i];
  const yaRegado = accionesLocales[i] && accionesLocales[i].riego;
  const yaFert   = accionesLocales[i] && accionesLocales[i].fert;
  document.getElementById('detail-content').innerHTML = `
    <div class="detail-header">
      <div><div class="detail-name">${c.nombre || c.tipo}</div><div class="detail-sub">${c.tipo} · ${c.metodo}</div></div>
      <button class="btn-close" onclick="cerrarDetalle()">✕</button>
    </div>
    ${yaRegado || yaFert ? `<div class="nota-riego">✅ Cambios guardados. Las recomendaciones se actualizarán en la próxima actualización automática.</div>` : ''}
    <div class="action-btns">
      <button class="btn-action btn-riego ${yaRegado ? 'done' : ''}" id="btn-riego-${i}" onclick="marcarAccion(${i}, 'riego')" ${yaRegado ? 'disabled' : ''}>
        <span class="btn-icon">${yaRegado ? '✅' : '💧'}</span>
        <span class="btn-lbl">${yaRegado ? 'Regado hoy' : 'Marcar regado'}</span>
      </button>
      <button class="btn-action btn-fert ${yaFert ? 'done' : ''}" id="btn-fert-${i}" onclick="marcarAccion(${i}, 'fertilizacion')" ${yaFert ? 'disabled' : ''}>
        <span class="btn-icon">${yaFert ? '✅' : '🌱'}</span>
        <span class="btn-lbl">${yaFert ? 'Fertilizado hoy' : 'Marcar fertilizado'}</span>
      </button>
    </div>
    <div class="detail-section">
      <div class="detail-section-title">Estado del cultivo</div>
      <div class="detail-row"><span class="detail-row-lbl">Riego</span><span class="detail-row-val">${getRecomRiego(c,i)}</span></div>
      <div class="detail-row"><span class="detail-row-lbl">Semáforo riego</span><span class="detail-row-val"><span class="badge ${getBadgeClass(getSemaforoRiego(c,i))}">${getSemaforoRiego(c,i)}</span></span></div>
      <div class="detail-row"><span class="detail-row-lbl">Fertilización</span><span class="detail-row-val">${getProximaFert(c,i)}</span></div>
      <div class="detail-row"><span class="detail-row-lbl">Semáforo fert.</span><span class="detail-row-val"><span class="badge ${getBadgeClass(getSemaforoFert(c,i))}">${getSemaforoFert(c,i)}</span></span></div>
    </div>
    <div class="detail-section">
      <div class="detail-section-title">Cosecha</div>
      <div class="detail-row"><span class="detail-row-lbl">Días restantes</span><span class="detail-row-val">${c.diasCosecha || '—'}</span></div>
      <div class="detail-row"><span class="detail-row-lbl">Fecha estimada</span><span class="detail-row-val">${c.fechaCosecha || '—'}</span></div>
    </div>
    <div class="detail-section">
      <div class="detail-section-title">Información</div>
      <div class="detail-row"><span class="detail-row-lbl">Plantado</span><span class="detail-row-val">${c.fechaPlant || '—'}</span></div>
      <div class="detail-row"><span class="detail-row-lbl">Último riego</span><span class="detail-row-val">${yaRegado ? 'Hoy' : (c.ultimoRiego || '—')}</span></div>
      <div class="detail-row"><span class="detail-row-lbl">Temporada</span><span class="detail-row-val">${c.temporada || '—'}</span></div>
      ${c.descripcion ? `<div class="detail-row"><span class="detail-row-lbl">Descripción</span><span class="detail-row-val">${c.descripcion}</span></div>` : ''}
    </div>`;
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

async function marcarAccion(indice, accion) {
  const btnId   = accion === 'riego' ? `btn-riego-${indice}` : `btn-fert-${indice}`;
  const btn     = document.getElementById(btnId);
  const cultivo = datosGlobales.cultivos[indice];

  btn.disabled  = true;
  btn.innerHTML = '<span class="btn-icon">⏳</span><span class="btn-lbl">Guardando...</span>';

  try {
    await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ accion: accion, id: cultivo.id }),
    });

    // Registrar accion localmente para mostrar feedback inmediato
    if (!accionesLocales[indice]) accionesLocales[indice] = {};
    if (accion === 'riego') accionesLocales[indice].riego = true;
    if (accion === 'fertilizacion') accionesLocales[indice].fert = true;

    const label = accion === 'riego' ? '💧 Riego guardado' : '🌱 Fertilización guardada';
    showToast(label + ' — ' + (cultivo.nombre || cultivo.tipo));

    // Actualizar vista del detalle
    verDetalle(indice);

    // Actualizar tambien la tarjeta en el listado
    renderListado();

  } catch(err) {
    showToast('Error: ' + (err ? (err.message || JSON.stringify(err)) : 'desconocido').substring(0, 100));
    btn.disabled  = false;
    btn.innerHTML = accion === 'riego'
      ? '<span class="btn-icon">💧</span><span class="btn-lbl">Marcar regado</span>'
      : '<span class="btn-icon">🌱</span><span class="btn-lbl">Marcar fertilizado</span>';
  }
}

function renderListado() {
  if (!datosGlobales) return;
  const datos    = datosGlobales;
  const urgentes = datos.cultivos.filter((c,i) => {
    const sr = getSemaforoRiego(c,i);
    const sf = getSemaforoFert(c,i);
    return sr.includes('URGENTE') || sf.includes('URGENTE');
  }).length;
  const prontos = datos.cultivos.filter((c,i) => {
    const sr = getSemaforoRiego(c,i);
    const sf = getSemaforoFert(c,i);
    return sr.includes('PRONTO') || sf.includes('PRONTO');
  }).length;

  let resumen = urgentes > 0
    ? `<div style="background:#FFEBEE;border-radius:10px;padding:12px 14px;margin-bottom:16px;font-size:13px;color:#C62828;font-weight:500;">🔴 ${urgentes} cultivo${urgentes>1?'s':''} necesita${urgentes>1?'n':''} atención urgente hoy</div>`
    : prontos > 0
    ? `<div style="background:#FFF8E1;border-radius:10px;padding:12px 14px;margin-bottom:16px;font-size:13px;color:#F57F17;font-weight:500;">🟡 ${prontos} cultivo${prontos>1?'s':''} necesita${prontos>1?'n':''} atención pronto</div>`
    : `<div style="background:#E8F5E9;border-radius:10px;padding:12px 14px;margin-bottom:16px;font-size:13px;color:#2E7D32;font-weight:500;">🟢 Todo en orden — nada urgente hoy</div>`;

  document.getElementById('content').innerHTML = `
    ${renderClima(datos.clima)}
    ${resumen}
    <div class="section-title">Mis cultivos (${datos.cultivos.length})</div>
    ${renderCultivos(datos.cultivos)}
    <div class="last-update">Última actualización: ${new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}</div>`;
}

function cerrarDetalle(e) {
  if (e && e.target !== document.getElementById('overlay')) return;
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow = '';
}

async function cargarDatos() {
  document.getElementById('content').innerHTML = `<div class="loading"><div class="spinner"></div><div>Cargando tu huerto...</div></div>`;
  accionesLocales = {}; // Limpiar acciones locales al recargar
  try {
    const r     = await fetch(API_URL);
    const datos = await r.json();
    datosGlobales = datos;
    renderListado();
  } catch(e) {
    document.getElementById('content').innerHTML = `
      <div class="error-box">No se pudieron cargar los datos.<br><br>
      <button onclick="cargarDatos()" style="margin-top:10px;padding:8px 16px;background:#C62828;color:white;border:none;border-radius:8px;font-size:13px;cursor:pointer;">Reintentar</button></div>`;
  }
}

cargarDatos();
setInterval(cargarDatos, 30 * 60 * 1000);
</script>
</body>
</html>
